interface Boundary {
  id: string;
  centerX: number; // Percentage 0-100
  centerY: number; // Percentage 0-100
  width: number;   // Percentage 0-100 (aligned with photo's own axes)
  height: number;  // Percentage 0-100 (aligned with photo's own axes)
  rotation: number; // Degrees clockwise
}

    // --- Services ---
    

function isWhiteRow(y: number, thresh: number, ctx: CanvasRenderingContext2D, width: number) {
  const d = ctx.getImageData(0, y, width, 1).data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] < 255 - thresh || d[i+1] < 255 - thresh || d[i+2] < 255 - thresh) return false;
  }
  return true;
}

function isWhiteCol(x: number, thresh: number, ctx: CanvasRenderingContext2D, height: number) {
  const d = ctx.getImageData(x, 0, 1, height).data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] < 255 - thresh || d[i+1] < 255 - thresh || d[i+2] < 255 - thresh) return false;
  }
  return true;
}

function getSegments(dir: 'h' | 'v', thresh: number, ctx: CanvasRenderingContext2D, width: number, height: number) {
  const len = dir === 'h' ? height : width;
  const isWhite = dir === 'h'
    ? (i: number) => isWhiteRow(i, thresh, ctx, width)
    : (i: number) => isWhiteCol(i, thresh, ctx, height);

  const segments: [number, number][] = [];
  let inContent = false, segStart = 0;

  for (let i = 0; i < len; i++) {
    const white = isWhite(i);
    if (!white && !inContent) { inContent = true; segStart = i; }
    if (white && inContent)  { inContent = false; segments.push([segStart, i - 1]); }
  }
  if (inContent) segments.push([segStart, len - 1]);
  return segments;
}

interface DetectOptions {
  mode: 'auto' | 'manual';
  thresh: number;
  rows: number;
  cols: number;
}

async function findPhotoBoundaries(imageBase64: string, mimeType: string, options?: DetectOptions): Promise<Boundary[]> {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) return reject(new Error('Canvas context not available'));
      
      ctx.drawImage(img, 0, 0);

      const thresh = options?.thresh ?? 20;
      
      let hSegs: [number, number][] = [];
      let vSegs: [number, number][] = [];

      if (options?.mode === 'manual') {
        const rows = options.rows || 3;
        const cols = options.cols || 3;
        
        for (let i = 0; i < rows; i++) {
          hSegs.push([
            Math.round(img.height * i / rows),
            Math.round(img.height * (i + 1) / rows) - 1
          ]);
        }
        for (let i = 0; i < cols; i++) {
          vSegs.push([
            Math.round(img.width * i / cols),
            Math.round(img.width * (i + 1) / cols) - 1
          ]);
        }
      } else {
        hSegs = getSegments('h', thresh, ctx, img.width, img.height);
        vSegs = getSegments('v', thresh, ctx, img.width, img.height);
      }

      const boundaries: Boundary[] = [];
      let idx = 0;
      
      for (let r = 0; r < hSegs.length; r++) {
        const [y0, y1] = hSegs[r];
        const h = y1 - y0 + 1;
        for (let c = 0; c < vSegs.length; c++) {
          const [x0, x1] = vSegs[c];
          const w = x1 - x0 + 1;
          if (w < 4 || h < 4) continue;
          
          boundaries.push({
            id: `boundary-${Date.now()}-${idx++}`,
            centerX: ((x0 + x1) / 2 / img.width) * 100,
            centerY: ((y0 + y1) / 2 / img.height) * 100,
            width: (w / img.width) * 100,
            height: (h / img.height) * 100,
            rotation: 0
          });
        }
      }
      resolve(boundaries);
    };
    img.onerror = () => reject(new Error('Failed to load image for detection'));
    img.src = `data:${mimeType};base64,${imageBase64}`;
  });
}

async function restorePhoto(imageBase64: string, mimeType: string): Promise<string> {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      if (!ctx) return reject(new Error('Canvas context not available'));
      
      // Basic local restore using filters (contrast, brightness, saturation)
      ctx.filter = 'contrast(1.1) brightness(1.05) saturate(1.2)';
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL(mimeType || 'image/png'));
    };
    img.onerror = () => reject(new Error('Failed to load image for restoration'));
    img.src = `data:${mimeType};base64,${imageBase64}`;
  });
}

interface ImageUploaderProps {
  onImagesUpload: (uploads: { dataUrl: string; file: File }[]) => void;
  disabled: boolean;
}

const ImageUploader: React.FC<ImageUploaderProps> = ({ onImagesUpload, disabled }) => {
  const [isDragging, setIsDragging] = useState(false);

  const handleFileChange = async (files: FileList | null) => {
    if (!files || files.length === 0) return;

    const fileArray = Array.from(files);
    const uploadPromises = fileArray.map((file) => {
      return new Promise<{ dataUrl: string; file: File }>((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          if (e.target && typeof e.target.result === 'string') {
            resolve({ dataUrl: e.target.result, file });
          } else {
            reject(new Error("Failed to read file"));
          }
        };
        reader.onerror = () => reject(new Error("File error"));
        reader.readAsDataURL(file);
      });
    });

    try {
      const results = await Promise.all(uploadPromises);
      onImagesUpload(results);
    } catch (err) {
      console.error("Error uploading images:", err);
    }
  };

  const handleDragEnter = useCallback((e: React.DragEvent<HTMLLabelElement>) => {
    e.preventDefault();
    e.stopPropagation();
    if (!disabled) setIsDragging(true);
  }, [disabled]);

  const handleDragLeave = useCallback((e: React.DragEvent<HTMLLabelElement>) => {
    e.preventDefault();
    e.stopPropagation();
    setIsDragging(false);
  }, []);

  const handleDragOver = useCallback((e: React.DragEvent<HTMLLabelElement>) => {
    e.preventDefault();
    e.stopPropagation();
  }, []);

  const handleDrop = useCallback((e: React.DragEvent<HTMLLabelElement>) => {
    e.preventDefault();
    e.stopPropagation();
    setIsDragging(false);
    if (!disabled && e.dataTransfer.files) {
      handleFileChange(e.dataTransfer.files);
    }
  }, [disabled]);


  return (
    <div className="w-full max-w-2xl mx-auto">
      <label
        onDragEnter={handleDragEnter}
        onDragLeave={handleDragLeave}
        onDragOver={handleDragOver}
        onDrop={handleDrop}
        className={`flex justify-center w-full h-64 px-4 transition bg-slate-800 border-2 ${isDragging ? 'border-sky-400' : 'border-slate-600'} border-dashed rounded-md appearance-none cursor-pointer hover:border-slate-400 focus:outline-none`}>
        <span className="flex flex-col items-center justify-center space-x-2">
          <UploadIcon className="w-12 h-12 text-slate-500"/>
          <span className="font-medium text-slate-400">
            Drop multiple scans here, or <span className="text-sky-400 underline">browse</span>
          </span>
          <span className="text-xs text-slate-500">PNG, JPG, WEBP • Batch upload supported</span>
        </span>
        <input
            type="file"
            name="file_upload"
            className="hidden"
            accept="image/png, image/jpeg, image/webp"
            onChange={(e) => handleFileChange(e.target.files)}
            disabled={disabled}
            multiple
        />
      </label>
    </div>
  );
};


    



interface PhotoDisplayProps {
  imageUrl: string;
  boundaries: Boundary[];
  selectedBoundaryId: string | null;
  onSelectBoundary: (id: string | null) => void;
  onUpdateBoundary: (boundary: Boundary) => void;
  onDeleteBoundary: (id: string) => void;
  labelOffset?: number;
  onInteractionStart?: () => void;
}

const HANDLE_NAMES = ['tl', 't', 'tr', 'l', 'r', 'bl', 'b', 'br'] as const;
type Handle = typeof HANDLE_NAMES[number] | 'move' | 'rotate';

const SNAP_THRESHOLD = 1.2; 
const MIN_SIZE = 1.5; // Min 1.5% of parent

const PhotoDisplay: React.FC<PhotoDisplayProps> = ({ 
    imageUrl, 
    boundaries,
    selectedBoundaryId,
    onSelectBoundary,
    onUpdateBoundary,
    onDeleteBoundary,
    labelOffset = 0,
    onInteractionStart
}) => {
  const containerRef = useRef<HTMLDivElement>(null);
  const [activeGuidelines, setActiveGuidelines] = useState<{ x?: number[]; y?: number[] }>({});
  const [readout, setReadout] = useState<string | null>(null);
  const [isShiftDown, setIsShiftDown] = useState(false);
  
  const interactionRef = useRef<{ 
    handle: Handle, 
    initialBoundary: Boundary,
    anchorGlobalX: number,
    anchorGlobalY: number,
    startAngle: number,
    startMouseX: number,
    startMouseY: number,
    aspectRatio: number
  } | null>(null);

  // Monitor Shift Key
  useEffect(() => {
    const handleKey = (e: KeyboardEvent) => setIsShiftDown(e.shiftKey);
    window.addEventListener('keydown', handleKey);
    window.addEventListener('keyup', handleKey);
    return () => {
      window.removeEventListener('keydown', handleKey);
      window.removeEventListener('keyup', handleKey);
    };
  }, []);

  const getCursorClass = (handle: Handle) => {
    switch(handle) {
      case 'move': return 'cursor-move';
      case 'rotate': return 'cursor-alias';
      case 'tl': case 'br': return 'cursor-nwse-resize';
      case 'tr': case 'bl': return 'cursor-nesw-resize';
      case 't': case 'b': return 'cursor-ns-resize';
      case 'l': case 'r': return 'cursor-ew-resize';
      default: return '';
    }
  }

  const handleMouseDown = (e: React.MouseEvent<HTMLDivElement>, boundary: Boundary, handle: Handle) => {
    e.stopPropagation();
    e.preventDefault();
    
    if (onInteractionStart) onInteractionStart();
    onSelectBoundary(boundary.id);
    
    const containerRect = containerRef.current!.getBoundingClientRect();
    const centerX = (boundary.centerX / 100) * containerRect.width + containerRect.left;
    const centerY = (boundary.centerY / 100) * containerRect.height + containerRect.top;
    
    const rad = (boundary.rotation * Math.PI) / 180;
    const cos = Math.cos(rad);
    const sin = Math.sin(rad);

    let localAnchorX = 0;
    let localAnchorY = 0;

    if (handle.includes('l')) localAnchorX = boundary.width / 2;
    if (handle.includes('r')) localAnchorX = -boundary.width / 2;
    if (handle.includes('t')) localAnchorY = boundary.height / 2;
    if (handle.includes('b')) localAnchorY = -boundary.height / 2;

    const anchorGlobalX = centerX + (localAnchorX * cos - localAnchorY * sin) * (containerRect.width / 100);
    const anchorGlobalY = centerY + (localAnchorX * sin + localAnchorY * cos) * (containerRect.height / 100);

    interactionRef.current = { 
        handle, 
        initialBoundary: { ...boundary },
        anchorGlobalX,
        anchorGlobalY,
        startAngle: Math.atan2(e.clientY - centerY, e.clientX - centerX),
        startMouseX: e.clientX,
        startMouseY: e.clientY,
        aspectRatio: boundary.width / boundary.height
    };
    containerRef.current?.classList.add(getCursorClass(handle));
  };

  const handleMouseUp = useCallback(() => {
    if (interactionRef.current) {
        containerRef.current?.classList.remove(getCursorClass(interactionRef.current.handle));
    }
    interactionRef.current = null;
    setActiveGuidelines({});
    setReadout(null);
  }, []);

  const handleMouseMove = useCallback((e: MouseEvent) => {
    const interaction = interactionRef.current;
    const container = containerRef.current;
    if (!interaction || !container) return;

    const { handle, initialBoundary, anchorGlobalX, anchorGlobalY, startAngle, startMouseX, startMouseY, aspectRatio } = interaction;
    const containerRect = container.getBoundingClientRect();
    
    let { centerX, centerY, width, height, rotation } = initialBoundary;

    if (handle === 'move') {
      const dxPerc = ((e.clientX - startMouseX) / containerRect.width) * 100;
      const dyPerc = ((e.clientY - startMouseY) / containerRect.height) * 100;
      centerX = Math.max(0, Math.min(100, initialBoundary.centerX + dxPerc));
      centerY = Math.max(0, Math.min(100, initialBoundary.centerY + dyPerc));
      setReadout(`${centerX.toFixed(1)}%, ${centerY.toFixed(1)}%`);
    } else if (handle === 'rotate') {
        const cx = (initialBoundary.centerX / 100) * containerRect.width + containerRect.left;
        const cy = (initialBoundary.centerY / 100) * containerRect.height + containerRect.top;
        const currentAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
        const angleDiff = (currentAngle - startAngle) * (180 / Math.PI);
        rotation = (initialBoundary.rotation + angleDiff) % 360;
        if (rotation < 0) rotation += 360;
        
        // Smart Snap to 90deg steps
        if (Math.abs(rotation % 90) < 3 || Math.abs(rotation % 90) > 87) {
          rotation = Math.round(rotation / 90) * 90;
        }
        setReadout(`${rotation.toFixed(1)}°`);
    } else {
        const rad = (rotation * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        const vGlobalX = e.clientX - anchorGlobalX;
        const vGlobalY = e.clientY - anchorGlobalY;

        const vLocalX = (vGlobalX * cos + vGlobalY * sin) / (containerRect.width / 100);
        const vLocalY = (-vGlobalX * sin + vGlobalY * cos) / (containerRect.height / 100);

        let newLocalWidth = width;
        let newLocalHeight = height;

        if (handle.includes('r')) newLocalWidth = Math.max(MIN_SIZE, vLocalX);
        else if (handle.includes('l')) newLocalWidth = Math.max(MIN_SIZE, -vLocalX);

        if (handle.includes('b')) newLocalHeight = Math.max(MIN_SIZE, vLocalY);
        else if (handle.includes('t')) newLocalHeight = Math.max(MIN_SIZE, -vLocalY);

        // ASPECT RATIO LOCK (Shift Key)
        if (isShiftDown) {
            if (handle.length === 2) { // Corners
                const scale = Math.max(newLocalWidth / width, newLocalHeight / height);
                newLocalWidth = width * scale;
                newLocalHeight = height * scale;
            } else if (handle === 'l' || handle === 'r') {
                newLocalHeight = newLocalWidth / aspectRatio;
            } else if (handle === 't' || handle === 'b') {
                newLocalWidth = newLocalHeight * aspectRatio;
            }
        }

        width = newLocalWidth;
        height = newLocalHeight;

        let localCenterXOffset = 0;
        let localCenterYOffset = 0;
        if (handle.includes('r')) localCenterXOffset = width / 2;
        else if (handle.includes('l')) localCenterXOffset = -width / 2;
        if (handle.includes('b')) localCenterYOffset = height / 2;
        else if (handle.includes('t')) localCenterYOffset = -height / 2;

        centerX = ((anchorGlobalX - containerRect.left) / containerRect.width) * 100 + (localCenterXOffset * cos - localCenterYOffset * sin);
        centerY = ((anchorGlobalY - containerRect.top) / containerRect.height) * 100 + (localCenterXOffset * sin + localCenterYOffset * cos);

        setReadout(`${width.toFixed(1)}% × ${height.toFixed(1)}%`);
    }

    // ENHANCED SNAPPING
    const isSnappedRot = Math.abs(rotation % 90) < 0.1 || Math.abs(rotation % 90) > 89.9;
    if (handle !== 'rotate' && isSnappedRot) {
      const snapX: number[] = [0, 50, 100]; 
      const snapY: number[] = [0, 50, 100];
      
      boundaries.forEach(b => {
        if (b.id === initialBoundary.id) return;
        snapX.push(b.centerX, b.centerX - b.width/2, b.centerX + b.width/2);
        snapY.push(b.centerY, b.centerY - b.height/2, b.centerY + b.height/2);
      });

      const activeX: number[] = [];
      const activeY: number[] = [];

      [centerX, centerX - width/2, centerX + width/2].forEach((val) => {
        for (const target of snapX) {
          if (Math.abs(val - target) < SNAP_THRESHOLD) {
            centerX += (target - val);
            activeX.push(target);
            break;
          }
        }
      });

      [centerY, centerY - height/2, centerY + height/2].forEach((val) => {
        for (const target of snapY) {
          if (Math.abs(val - target) < SNAP_THRESHOLD) {
            centerY += (target - val);
            activeY.push(target);
            break;
          }
        }
      });

      setActiveGuidelines({ x: activeX, y: activeY });
    }
    
    // Clamp to Scan Area
    centerX = Math.max(width/2, Math.min(100 - width/2, centerX));
    centerY = Math.max(height/2, Math.min(100 - height/2, centerY));

    onUpdateBoundary({ ...initialBoundary, centerX, centerY, width, height, rotation });
  }, [onUpdateBoundary, boundaries, isShiftDown]);

  useEffect(() => {
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    return () => {
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('mouseup', handleMouseUp);
    };
  }, [handleMouseMove, handleMouseUp]);

  return (
    <div 
        ref={containerRef}
        className="relative w-full max-w-4xl mx-auto border-2 border-slate-700 rounded-xl shadow-2xl overflow-hidden bg-slate-950 group/display cursor-crosshair select-none"
        onClick={() => onSelectBoundary(null)}
    >
      <img src={imageUrl} alt="Scanned photos" className="block w-full h-auto select-none opacity-90 transition-opacity group-hover/display:opacity-85" draggable="false" />
      
      {/* Smart Snapping Guidelines */}
      {activeGuidelines.x?.map((x, i) => (
        <div key={`guideline-x-${x}-${i}`} className="absolute top-0 bottom-0 border-l border-sky-400/60 z-[100] pointer-events-none shadow-[0_0_10px_rgba(56,189,248,0.5)]" style={{ left: `${x}%` }} />
      ))}
      {activeGuidelines.y?.map((y, i) => (
        <div key={`guideline-y-${y}-${i}`} className="absolute left-0 right-0 border-t border-sky-400/60 z-[100] pointer-events-none shadow-[0_0_10px_rgba(56,189,248,0.5)]" style={{ top: `${y}%` }} />
      ))}

      {boundaries.map((box, index) => {
        const isSelected = box.id === selectedBoundaryId;
        return (
          <div
            key={box.id}
            className={`absolute ${isSelected ? 'border-sky-400 z-30 ring-2 ring-sky-400/40 shadow-[0_0_50px_rgba(56,189,248,0.4)]' : 'border-white/20 hover:border-sky-400/50 hover:bg-sky-400/5 z-10'} border-2 transition-all duration-100`}
            style={{
              left: `${box.centerX}%`,
              top: `${box.centerY}%`,
              width: `${box.width}%`,
              height: `${box.height}%`,
              transform: `translate(-50%, -50%) rotate(${box.rotation}deg)`,
              transformOrigin: 'center center'
            }}
            onMouseDown={(e) => handleMouseDown(e, box, 'move')}
          >
            {/* Box ID Label */}
            <div 
                className={`absolute -top-10 -left-1 px-3 py-1.5 text-[10px] font-black tracking-widest uppercase ${isSelected ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-400'} rounded-lg shadow-2xl pointer-events-none flex items-center gap-2 whitespace-nowrap z-50 border border-white/10`}
                style={{ transform: `rotate(${-box.rotation}deg)`, transformOrigin: 'bottom left' }}
            >
              <div className={`w-2 h-2 rounded-full ${isSelected ? 'bg-white animate-pulse' : 'bg-slate-500'}`} />
              PRINT #{index + 1 + labelOffset}
            </div>

            {/* Readout HUD */}
            {isSelected && readout && (
                <div 
                    className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 backdrop-blur-2xl px-5 py-2.5 rounded-2xl border border-sky-400/40 text-sky-300 text-[10px] font-black uppercase tracking-[0.2em] whitespace-nowrap z-[100] shadow-3xl pointer-events-none border-t-sky-400/60"
                    style={{ transform: `translate(-50%, -50%) rotate(${-box.rotation}deg)` }}
                >
                    {readout}
                    {isShiftDown && <span className="ml-2 text-white/50">• ASPECT LOCKED</span>}
                </div>
            )}
            
            {isSelected && (
              <>
                {/* Delete Trigger */}
                <button 
                  className="absolute -top-6 -right-6 w-12 h-12 bg-slate-900 border-2 border-red-500/60 text-red-500 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white transition-all z-[60] shadow-3xl hover:scale-110 active:scale-90 group/del"
                  onMouseDown={(e) => { e.stopPropagation(); onDeleteBoundary(box.id); }}
                  style={{ transform: `rotate(${-box.rotation}deg)` }}
                  title="Remove Box (Del)"
                >
                  <TrashIcon className="w-6 h-6 group-hover:rotate-12 transition-transform" />
                </button>

                {/* Primary Rotation Handle */}
                <div className="absolute -top-24 left-1/2 -translate-x-1/2 flex flex-col items-center z-[55]">
                    <div 
                        className="w-14 h-14 rounded-full bg-slate-900 border-2 border-sky-400/80 shadow-3xl cursor-alias flex items-center justify-center text-sky-400 hover:bg-sky-400 hover:text-slate-900 transition-all active:scale-90 group/rot"
                        onMouseDown={(e) => handleMouseDown(e, box, 'rotate')}
                    >
                        <RotateIcon className="w-7 h-7 transition-transform duration-500 group-hover:rotate-180" />
                    </div>
                    <div className="w-0.5 h-12 bg-gradient-to-t from-sky-400/80 to-transparent" />
                </div>

                {/* Resize Handles */}
                {HANDLE_NAMES.map(handle => {
                  const positions = {
                    t: 'top-0 left-1/2 -translate-x-1/2 -translate-y-1/2',
                    b: 'bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2',
                    l: 'left-0 top-1/2 -translate-y-1/2 -translate-x-1/2',
                    r: 'right-0 top-1/2 -translate-y-1/2 translate-x-1/2',
                    tl: 'top-0 left-0 -translate-x-1/2 -translate-y-1/2',
                    tr: 'top-0 right-0 translate-x-1/2 -translate-y-1/2',
                    bl: 'bottom-0 left-0 -translate-x-1/2 translate-y-1/2',
                    br: 'bottom-0 right-0 translate-x-1/2 translate-y-1/2',
                  }
                  
                  const isCorner = handle.length === 2;
                  
                  return (
                    <div
                      key={handle}
                      className={`absolute ${isCorner ? 'w-6 h-6 border-[3px]' : 'w-4 h-4 border-2'} bg-slate-950 border-sky-400 rounded-lg z-[55] ${getCursorClass(handle)} ${positions[handle]} hover:scale-125 hover:bg-sky-400 transition-all shadow-xl active:bg-white active:border-white`}
                      onMouseDown={(e) => handleMouseDown(e, box, handle)}
                    />
                  )
                })}
              </>
            )}
          </div>
        )
      })}
    </div>
  );
};


    



interface SplitPhotoGalleryProps {

  onRestore: (id: string) => void;

    if (previewIndex === null) return;
    if (direction === 'next') {
      setPreviewIndex((previewIndex + 1) % images.length);
    } else {
      setPreviewIndex((previewIndex - 1 + images.length) % images.length);
    }
  }, [previewIndex, images.length]);

  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if (previewIndex === null) return;

      if (e.key === 'ArrowRight') navigatePreview('next');
      if (e.key === 'ArrowLeft') navigatePreview('prev');
      if (e.key === 'r' || e.key === 'R') onRotate(images[previewIndex].id);
      if (e.key === 'e' || e.key === 'E') onRestore(images[previewIndex].id);
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [previewIndex, closePreview, navigatePreview, onRotate, onRestore, images]);

            Download All

  );
};

const MAX_HISTORY = 50;

function App() {
  const [scans, setScans] = useState<SourceScan[]>([]);
  const [activeScanId, setActiveScanId] = useState<string | null>(null);
  const [selectedBoundaryId, setSelectedBoundaryId] = useState<string | null>(null);
  const [splitImages, setSplitImages] = useState<CroppedImage[]>([]);
  const [error, setError] = useState<string | null>(null);

  const [detectMode, setDetectMode] = useState<'auto' | 'manual'>('auto');
  const [detectThresh, setDetectThresh] = useState<number>(20);
  const [detectRows, setDetectRows] = useState<number>(3);
  const [detectCols, setDetectCols] = useState<number>(3);

  const activeScan = useMemo(() => 
    scans.find(s => s.id === activeScanId) || null
  , [scans, activeScanId]);

  const selectedBoundary = useMemo(() => {
    if (!activeScan || !selectedBoundaryId) return null;
    return activeScan.boundaries.find(b => b.id === selectedBoundaryId) || null;
  }, [activeScan, selectedBoundaryId]);

  const labelOffset = useMemo(() => {
    if (!activeScanId) return splitImages.length;
    const activeScanIndex = scans.findIndex(s => s.id === activeScanId);
    if (activeScanIndex === -1) return splitImages.length;
    const previousScansBoundariesCount = scans
      .slice(0, activeScanIndex)
      .reduce((acc, scan) => acc + scan.boundaries.length, 0);
    return splitImages.length + previousScansBoundariesCount;
  }, [scans, activeScanId, splitImages.length]);

  const updateScanState = useCallback((id: string, updates: Partial<SourceScan>) => {
    setScans(prev => prev.map(s => s.id === id ? { ...s, ...updates } : s));
  }, []);

  const pushToHistory = useCallback((id: string, currentBoundaries: Boundary[]) => {
    setScans(prev => prev.map(s => {
      if (s.id !== id) return s;
      const history = [...(s.history || []), [...s.boundaries]].slice(-MAX_HISTORY);
      return { ...s, history, future: [] }; // Reset future when a new action is performed
    }));
  }, []);

  const handleUndo = useCallback(() => {
    if (!activeScan || !activeScan.history || activeScan.history.length === 0) return;
    
    setScans(prev => prev.map(s => {
      if (s.id !== activeScan.id || !s.history || s.history.length === 0) return s;
      
      const newHistory = [...s.history];
      const previousState = newHistory.pop()!;
      const newFuture = [[...s.boundaries], ...(s.future || [])].slice(0, MAX_HISTORY);
      
      return {
        ...s,
        boundaries: previousState,
        history: newHistory,
        future: newFuture
      };
    }));
    setSelectedBoundaryId(null);
  }, [activeScan]);

  const handleRedo = useCallback(() => {
    if (!activeScan || !activeScan.future || activeScan.future.length === 0) return;

    setScans(prev => prev.map(s => {
      if (s.id !== activeScan.id || !s.future || s.future.length === 0) return s;
      
      const newFuture = [...s.future];
      const nextState = newFuture.shift()!;
      const newHistory = [...(s.history || []), [...s.boundaries]].slice(-MAX_HISTORY);
      
      return {
        ...s,
        boundaries: nextState,
        history: newHistory,
        future: newFuture
      };
    }));
    setSelectedBoundaryId(null);
  }, [activeScan]);

  // Keyboard shortcuts
  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey) handleRedo();
        else handleUndo();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
        e.preventDefault();
        handleRedo();
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedBoundaryId && activeScanId) {
          handleDeleteBoundary(selectedBoundaryId);
        }
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [handleUndo, handleRedo, selectedBoundaryId, activeScanId]);

  const resetAll = () => {
    setScans([]);
    setActiveScanId(null);
    setSelectedBoundaryId(null);
    setSplitImages([]);
    setError(null);
  };

  const handleImagesUpload = (uploads: { dataUrl: string; file: File }[]) => {
    const newScans: SourceScan[] = uploads.map(u => ({
      id: `scan-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
      dataUrl: u.dataUrl,
      file: u.file,
      boundaries: [],
      isDetected: false,
      isProcessing: false,
      statusText: '',
      history: [],
      future: []
    }));
    setScans(prev => [...prev, ...newScans]);
    if (!activeScanId && newScans.length > 0) setActiveScanId(newScans[0].id);
  };

  const removeScan = (id: string) => {
    setScans(prev => {
      const filtered = prev.filter(s => s.id !== id);
      if (activeScanId === id) setActiveScanId(filtered.length > 0 ? filtered[0].id : null);
      return filtered;
    });
  };

  const cropImages = useCallback(async (imageSrc: string, boundariesToCrop: Boundary[]): Promise<CroppedImage[]> => {
    return new Promise((resolve) => {
      const image = new Image();
      image.src = imageSrc;
      image.onload = () => {
        const cropped: CroppedImage[] = boundariesToCrop.map((box, index) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          if (!ctx) return { id: `err-${index}`, dataUrl: '' };

          const pixelWidth = (box.width / 100) * image.naturalWidth;
          const pixelHeight = (box.height / 100) * image.naturalHeight;
          const pixelCenterX = (box.centerX / 100) * image.naturalWidth;
          const pixelCenterY = (box.centerY / 100) * image.naturalHeight;
          
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;

          ctx.translate(pixelWidth / 2, pixelHeight / 2);
          ctx.rotate((-box.rotation * Math.PI) / 180);
          ctx.drawImage(image, -pixelCenterX, -pixelCenterY);
          
          return { id: `crop-${index}-${Date.now()}`, dataUrl: canvas.toDataURL('image/png') };
        });
        resolve(cropped.filter(img => img.dataUrl));
      };
      image.onerror = () => resolve([]);
    });
  }, []);

  const handleRotate90 = useCallback((id: string) => {
    setSplitImages(prev => prev.map(item => {
      if (item.id !== id) return item;
      const img = new Image();
      img.src = item.dataUrl;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) return item;
      canvas.width = img.height;
      canvas.height = img.width;
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      return { ...item, dataUrl: canvas.toDataURL('image/png') };
    }));
  }, []);

  const handleBoundaryRotate = (direction: 'cw' | 'ccw') => {
    if (!activeScanId || !selectedBoundaryId || !selectedBoundary) return;
    pushToHistory(activeScanId, activeScan!.boundaries);
    const amount = direction === 'cw' ? 90 : -90;
    const updated = { ...selectedBoundary, rotation: (selectedBoundary.rotation + amount) % 360 };
    handleUpdateBoundary(updated);
  };

  const handleRestoreImage = useCallback(async (id: string) => {
    const target = splitImages.find(img => img.id === id);
    if (!target || target.isRestoring) return;
    setSplitImages(prev => prev.map(img => img.id === id ? { ...img, isRestoring: true } : img));
    try {
      const base64Data = target.dataUrl.split(',')[1];
      const restoredDataUrl = await restorePhoto(base64Data, 'image/png');
      setSplitImages(prev => prev.map(img => img.id === id ? { ...img, dataUrl: restoredDataUrl, isRestoring: false } : img));
    } catch (e: any) {
      setError(`Restoration failed: ${e.message}`);
      setSplitImages(prev => prev.map(img => img.id === id ? { ...img, isRestoring: false } : img));
    }
  }, [splitImages]);
  
  const handleAutoSplit = async (id: string) => {
    const scan = scans.find(s => s.id === id);
    if (!scan) return;
    updateScanState(id, { isProcessing: true, statusText: 'Detecting boundaries...' });
    setError(null);
    try {
      const base64Data = scan.dataUrl.split(',')[1];
      const detectedBoundaries = await findPhotoBoundaries(base64Data, scan.file.type, {
        mode: detectMode,
        thresh: detectThresh,
        rows: detectRows,
        cols: detectCols
      });
      
      setScans(prev => prev.map(s => s.id === id ? {
        ...s,
        boundaries: detectedBoundaries,
        isDetected: true,
        isProcessing: false,
        history: [...(s.history || []), [...s.boundaries]].slice(-MAX_HISTORY),
        future: []
      } : s));
    } catch (e: any) {
      setError(e.message);
      updateScanState(id, { isProcessing: false });
    }
  };

  const handleConfirmAndCrop = async (id: string) => {
    const scan = scans.find(s => s.id === id);
    if (!scan) return;
    updateScanState(id, { isProcessing: true, statusText: 'Straightening & Exporting...' });
    try {
      const cropped = await cropImages(scan.dataUrl, scan.boundaries);
      setSplitImages(prev => [...prev, ...cropped]);
      removeScan(id);
    } catch (e: any) {
      setError(e.message);
      updateScanState(id, { isProcessing: false });
    }
  };

  const handleUpdateBoundary = (updated: Boundary) => {
    if (!activeScanId) return;
    setScans(prev => prev.map(s => s.id === activeScanId ? {
      ...s, boundaries: s.boundaries.map(b => b.id === updated.id ? updated : b)
    } : s));
  };

  const handleAddBoundary = () => {
    if (!activeScanId || !activeScan) return;
    pushToHistory(activeScanId, activeScan.boundaries);
    const newB: Boundary = { id: `m-${Date.now()}`, centerX: 50, centerY: 50, width: 30, height: 40, rotation: 0 };
    setScans(prev => prev.map(s => s.id === activeScanId ? { ...s, boundaries: [...s.boundaries, newB] } : s));
    setSelectedBoundaryId(newB.id);
  };

  const handleDeleteBoundary = (id: string) => {
    if (!activeScanId || !activeScan) return;
    pushToHistory(activeScanId, activeScan.boundaries);
    setScans(prev => prev.map(s => s.id === activeScanId ? { ...s, boundaries: s.boundaries.filter(b => b.id !== id) } : s));
    if (selectedBoundaryId === id) setSelectedBoundaryId(null);
  };

  const downloadImage = (dataUrl: string, index: number) => {
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = `photo-${index + 1}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const downloadAllImages = async () => {
    // @ts-ignore
    if (typeof JSZip === 'undefined') {
      splitImages.forEach((img, index) => {
        downloadImage(img.dataUrl, index);
      });
      return;
    }

    // @ts-ignore
    const zip = new JSZip();
    for (let i = 0; i < splitImages.length; i++) {
      const img = splitImages[i];
      const res = await fetch(img.dataUrl);
      const blob = await res.blob();
      zip.file(`photo-${i + 1}.png`, blob);
    }
    const out = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out);
    a.download = 'photo_ai_split.zip';
    a.click();
  };

  return (
    <div className="min-h-screen bg-slate-900 text-slate-200 p-4 sm:p-6 lg:p-8 font-sans selection:bg-sky-500/30">
      <main className="container mx-auto max-w-7xl">
        <header className="text-center mb-12">
          <h1 className="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-600 tracking-tight">
            Photo Splitter AI
          </h1>
          <p className="mt-4 text-slate-400 max-w-2xl mx-auto text-lg font-medium leading-relaxed">
            Batch-process old photo scans. Our precision AI automatically isolates, levels, and restores every individual shot.
          </p>
        </header>

        <section className="space-y-10 mb-16">
          {scans.length === 0 && <ImageUploader onImagesUpload={handleImagesUpload} disabled={false} />}

          {scans.length > 0 && (
            <div className="bg-slate-800/40 rounded-3xl border border-slate-700/50 p-8 shadow-2xl backdrop-blur-sm transition-all">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                <h3 className="text-2xl font-black text-white flex items-center gap-4">
                  Current Batch
                  <span className="bg-sky-500/10 text-sky-400 text-xs px-3 py-1 rounded-full border border-sky-500/20 uppercase tracking-widest">{scans.length} Scan{scans.length > 1 ? 's' : ''}</span>
                </h3>
                <div className="flex gap-4 w-full md:w-auto">
                  <button onClick={() => {
                    const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.onchange = (e: any) => handleImagesUpload(e.target.files); i.click();
                  }} className="flex-1 md:flex-none text-sm px-6 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all font-bold shadow-lg shadow-black/20 hover:-translate-y-0.5">+ Add Scans</button>
                  <button onClick={resetAll} className="flex-1 md:flex-none text-sm px-6 py-2.5 bg-red-950/20 hover:bg-red-950/40 text-red-400 rounded-xl border border-red-900/40 transition-all font-bold">Reset All</button>
                </div>
              </div>

              <div className="flex gap-5 overflow-x-auto pb-8 scrollbar-hide mb-8 border-b border-slate-700/40">
                {scans.map(scan => (
                  <div key={scan.id} onClick={() => setActiveScanId(scan.id)} className={`relative flex-shrink-0 w-32 h-32 rounded-2xl overflow-hidden cursor-pointer transition-all border-2 ${activeScanId === scan.id ? 'border-sky-400 ring-4 ring-sky-400/20 scale-110 shadow-2xl z-10' : 'border-slate-700 opacity-60 hover:opacity-100 hover:scale-105'}`}>
                    <img src={scan.dataUrl} className="w-full h-full object-cover" alt="Scan Thumbnail" />
                    {scan.isProcessing && <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] flex items-center justify-center"><Spinner size={8} /></div>}
                  </div>
                ))}
              </div>

              {activeScan && (
                <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                  {activeScan.boundaries.length === 0 && (
                    <div className="flex flex-col gap-6 items-center bg-slate-800/60 p-6 rounded-2xl border border-slate-700/50 mb-6">
                      <div className="flex flex-wrap gap-6 justify-center w-full max-w-3xl">
                        <div className="flex flex-col gap-2 min-w-[200px]">
                          <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Detection Mode</label>
                          <select 
                            value={detectMode}
                            onChange={(e) => setDetectMode(e.target.value as 'auto' | 'manual')}
                            className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                          >
                            <option value="auto">Auto-detect White Borders</option>
                            <option value="manual">Manual Grid Split</option>
                          </select>
                        </div>
                        
                        {detectMode === 'auto' ? (
                          <div className="flex flex-col gap-2 min-w-[200px]">
                            <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">White Threshold (0-100)</label>
                            <input 
                              type="number" 
                              value={detectThresh}
                              onChange={(e) => setDetectThresh(Number(e.target.value))}
                              min="0" max="100"
                              className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                            />
                          </div>
                        ) : (
                          <>
                            <div className="flex flex-col gap-2 min-w-[120px]">
                              <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Rows</label>
                              <input 
                                type="number" 
                                value={detectRows}
                                onChange={(e) => setDetectRows(Number(e.target.value))}
                                min="1" max="20"
                                className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                              />
                            </div>
                            <div className="flex flex-col gap-2 min-w-[120px]">
                              <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Columns</label>
                              <input 
                                type="number" 
                                value={detectCols}
                                onChange={(e) => setDetectCols(Number(e.target.value))}
                                min="1" max="20"
                                className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                              />
                            </div>
                          </>
                        )}
                      </div>
                      
                      <button onClick={() => handleAutoSplit(activeScan.id)} disabled={activeScan.isProcessing} className="px-8 py-4 bg-sky-600 text-white font-black rounded-2xl hover:bg-sky-500 disabled:opacity-50 transition-all flex items-center gap-3 shadow-xl shadow-sky-600/30 border border-sky-400/30 uppercase tracking-widest text-sm">
                        <MagicWandIcon className="w-6 h-6" /> Detect & Split
                      </button>
                    </div>
                  )}

                  <div className="flex flex-wrap gap-4 justify-center items-center">
                    {activeScan.boundaries.length > 0 && (
                      <>
                        <button onClick={() => handleConfirmAndCrop(activeScan.id)} disabled={activeScan.isProcessing} className="px-8 py-4 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-500 disabled:opacity-50 transition-all flex items-center gap-3 shadow-xl shadow-indigo-600/30 border border-indigo-400/30 uppercase tracking-widest text-sm"><CropIcon className="w-6 h-6" />Straighten & Split</button>
                        
                        <div className="flex gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-700 shadow-inner">
                          <button 
                            onClick={handleUndo} 
                            disabled={!activeScan.history || activeScan.history.length === 0} 
                            className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl transition-all"
                            title="Undo (Ctrl+Z)"
                          >
                            <UndoIcon className="w-6 h-6" />
                          </button>
                          <button 
                            onClick={handleRedo} 
                            disabled={!activeScan.future || activeScan.future.length === 0} 
                            className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl transition-all"
                            title="Redo (Ctrl+Y)"
                          >
                            <RedoIcon className="w-6 h-6" />
                          </button>
                        </div>

                        <div className="h-10 w-px bg-slate-700 mx-2 hidden sm:block" />

                        <div className="flex gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-700 shadow-inner">
                          <button 
                            onClick={() => handleBoundaryRotate('ccw')} 
                            disabled={!selectedBoundaryId} 
                            className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl transition-all"
                            title="Rotate Boundary -90°"
                          >
                            <RotateIcon className="w-6 h-6 -scale-x-100" />
                          </button>
                          <button 
                            onClick={() => handleBoundaryRotate('cw')} 
                            disabled={!selectedBoundaryId} 
                            className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl transition-all"
                            title="Rotate Boundary +90°"
                          >
                            <RotateIcon className="w-6 h-6" />
                          </button>
                        </div>

                        <button onClick={handleAddBoundary} disabled={activeScan.isProcessing} className="px-8 py-4 bg-slate-700 text-slate-200 font-black rounded-2xl hover:bg-slate-600 transition-all flex items-center gap-3 border border-slate-600 uppercase tracking-widest text-sm">
                          <AddIcon className="w-6 h-6" />Manual Box
                        </button>
                      </>
                    )}
                  </div>
                  <div className="relative">
                    <PhotoDisplay 
                      imageUrl={activeScan.dataUrl} 
                      boundaries={activeScan.boundaries} 
                      selectedBoundaryId={selectedBoundaryId} 
                      onSelectBoundary={setSelectedBoundaryId} 
                      onUpdateBoundary={handleUpdateBoundary} 
                      onDeleteBoundary={handleDeleteBoundary} 
                      labelOffset={labelOffset} 
                      onInteractionStart={() => pushToHistory(activeScan.id, activeScan.boundaries)}
                    />
                    {activeScan.isProcessing && (
                      <div className="absolute inset-0 bg-slate-950/40 backdrop-blur-md flex items-center justify-center z-50 rounded-2xl transition-all">
                        <div className="bg-slate-800/95 p-10 rounded-3xl shadow-3xl border border-slate-700 flex flex-col items-center gap-6 max-w-sm text-center">
                          <Spinner size={12} />
                          <div className="space-y-2">
                            <p className="text-sky-400 font-black text-lg uppercase tracking-[0.2em] animate-pulse">{activeScan.statusText}</p>
                            <p className="text-slate-500 text-sm font-medium">Sit back, our AI is doing the heavy lifting...</p>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                  {activeScan.boundaries.length > 0 && !selectedBoundaryId && (
                    <p className="text-center text-slate-500 font-medium italic animate-bounce">
                      Select a box to manually adjust its rotation and size
                    </p>
                  )}
                </div>
              )}
            </div>
          )}
        </section>

        {error && (
          <div className="max-w-2xl mx-auto p-6 mb-12 bg-red-950/40 border-2 border-red-500/30 text-red-100 rounded-3xl text-center shadow-2xl animate-in shake duration-300">
            <h4 className="font-black uppercase tracking-widest text-red-400 mb-2">Processing Error</h4>
            <p className="font-medium opacity-90">{error}</p>
            <button onClick={() => setError(null)} className="mt-4 px-6 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-300 rounded-full text-xs font-black uppercase tracking-widest transition-colors">Dismiss</button>
          </div>
        )}

        <div className="relative">
          <SplitPhotoGallery images={splitImages} onDownload={downloadImage} onDownloadAll={downloadAllImages} onRotate={handleRotate90} onRestore={handleRestoreImage} />
        </div>
      </main>
      <footer className="text-center mt-32 text-slate-600 text-sm border-t border-slate-800/50 pt-10 pb-16 font-medium">
        <p>Built with Local Browser Canvas AI • Professional Archival Digitization Pipeline</p>
        <p className="mt-2 opacity-60">Preserving history, one pixel at a time.</p>
      </footer>
    </div>
  );
}



    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<body class="bg-slate-900 text-slate-200 min-h-screen selection:bg-sky-500/30">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useCallback, useMemo, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import { GoogleGenAI, Type } from '@google/genai';

    const MAX_HISTORY = 50;
    const SNAP_THRESHOLD = 1.2;
    const MIN_SIZE = 1.5;
    const HANDLE_NAMES = ['tl', 't', 'tr', 'l', 'r', 'bl', 'b', 'br'];

    // --- API Key Helper ---
    const getApiKey = () => {
      let key = localStorage.getItem('GEMINI_API_KEY_STORAGE');
      if (!key) {
        key = prompt('Please enter your Gemini API Key for AI Auto-Detect & Restoration (get a free key at https://aistudio.google.com/apikey):');
        if (key) {
          localStorage.setItem('GEMINI_API_KEY_STORAGE', key.trim());
        }
      }
      return key || '';
    };

    // --- Icons ---
    const UploadIcon = ({ className = "w-8 h-8" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l-3.75 3.75M12 9.75l3.75 3.75M3 17.25V21h18v-3.75M4.5 12.75l7.5-7.5 7.5 7.5" />

    );

    const DownloadIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
      </svg>
    );

    const MagicWandIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
      </svg>
    );

    const UndoIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />

    const RedoIcon = ({ className = "w-5 h-5" }) => (

    const TrashIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12.548 0A48.108 48.108 0 016.25 5.397m12.548 0A48.11 48.11 0 0112 5.5c-2.678 0-5.216.38-7.624 1.027M15 5.79l-1.546-1.546a.75.75 0 00-1.06 0L10.5 5.79" />
      </svg>

    const CropIcon = ({ className = "w-5 h-5" }) => (

        <path strokeLinecap="round" strokeLinejoin="round" d="M7.875 14.25l-4.5-4.5m4.5 4.5l4.5-4.5m-4.5 4.5V21m0-6.75V3.375c0-.621.504-1.125 1.125-1.125h10.25c.621 0 1.125.504 1.125 1.125v10.25c0 .621-.504 1.125-1.125 1.125h-4.5" />
      </svg>
    );

    const AddIcon = ({ className = "w-5 h-5" }) => (

    const PreviewIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.43 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

    const CloseIcon = ({ className = "w-6 h-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />

    const RotateIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0011.664 0l3.18-3.182m0-4.991v4.99" />
      </svg>
    );

    const SparklesIcon = ({ className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
      </svg>
    );

    const Spinner = ({ size = 8 }) => (
      <svg className={`animate-spin text-sky-400 h-${size} w-${size}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    );

    // --- Gemini Services ---
    const responseSchema = {
      type: Type.ARRAY,
      items: {
        type: Type.OBJECT,
        properties: {
          centerX: { type: Type.NUMBER, description: 'Center X % (0-100)' },
          centerY: { type: Type.NUMBER, description: 'Center Y % (0-100)' },
          width: { type: Type.NUMBER, description: 'Width % (0-100)' },
          height: { type: Type.NUMBER, description: 'Height % (0-100)' },
          rotation: { type: Type.NUMBER, description: 'Clockwise rotation degrees (0-360)' }
        },
        required: ['centerX', 'centerY', 'width', 'height', 'rotation']
      }
    };

    const SYSTEM_INSTRUCTION = `You are a world-class archival digitization specialist. Your task is to identify individual physical photo prints within a single high-resolution scan with microscopic precision.

CRITICAL DETECTION PROTOCOL:
1. SUBSTRATE IDENTIFICATION: Detect the PHYSICAL PAPER footprint. This includes white margins, scalloped/deckled edges, and the paper backing. Do not crop into the image content if there is a border.
2. MICROSCOPIC GAP ANALYSIS: In tiled grids where photos touch, look for shadow-lines, texture shifts, and specular highlights. Separate touching prints with 100% accuracy.
3. RECTILINEAR VERIFICATION: Every print is a perfect rectangle. Verify all four corners. If a photo is tilted, calculate the exact tilt (e.g. 1.25 degrees).
4. SUB-PIXEL COORDINATES: Use 2 decimal places for all values (centerX, centerY, width, height, rotation) to ensure pixel-perfect alignment.
5. EXHAUSTIVE SEARCH: Ensure no small polaroids or scraps are missed.

Output strict JSON. Prioritize separation of adjacent items and archival edge preservation.`;

    async function findPhotoBoundaries(imageBase64, mimeType) {
      const apiKey = getApiKey();
      if (!apiKey) throw new Error("API Key required. Click '🔑 Set API Key' to configure.");
      const ai = new GoogleGenAI({ apiKey });
      const response = await ai.models.generateContent({
        model: 'gemini-3-pro-preview',
        contents: {
          parts: [
            { inlineData: { data: imageBase64, mimeType } },
            { text: "Perform a deep-space geometric analysis of this scan. Isolate every single physical photo print. Ensure overlapping or touching photos are cleanly separated into individual boxes with their own independent rotation." }
          ]
        },
        config: {
          systemInstruction: SYSTEM_INSTRUCTION,
          responseMimeType: 'application/json',
          responseSchema: responseSchema,
          temperature: 0,
          thinkingConfig: { thinkingBudget: 32768 }
        }
      });
      const text = response.text;
      if (!text) throw new Error("Empty response from AI");
      const boundaries = JSON.parse(text.trim());
      return boundaries.map((b, i) => ({ ...b, id: `boundary-${Date.now()}-${i}` }));
    }

    async function restorePhoto(imageBase64, mimeType) {
      const apiKey = getApiKey();
      if (!apiKey) throw new Error("API Key required.");
      const ai = new GoogleGenAI({ apiKey });
      const response = await ai.models.generateContent({
        model: 'gemini-2.5-flash-image',
        contents: {
          parts: [
            { inlineData: { data: imageBase64, mimeType } },
            { text: "Fully restore this photograph. Remove noise, scratches, and stains. Enhance clarity and colors." }
          ]
        }
      });
      const imagePart = response.candidates[0].content.parts.find(p => p.inlineData);
      if (imagePart?.inlineData?.data) {
        return `data:image/png;base64,${imagePart.inlineData.data}`;
      }
      throw new Error("No image returned");
    }

    // --- Components ---
    const ImageUploader = ({ onImagesUpload, disabled }) => {
      const [isDragging, setIsDragging] = useState(false);

      const handleFileChange = async (files) => {
        if (!files || files.length === 0) return;
        const fileArray = Array.from(files);
        const uploadPromises = fileArray.map((file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              if (e.target && typeof e.target.result === 'string') {
                resolve({ dataUrl: e.target.result, file });
              } else {
                reject(new Error("Failed to read file"));
              }
            };
            reader.onerror = () => reject(new Error("File error"));
            reader.readAsDataURL(file);
          });
        });

        try {
          const results = await Promise.all(uploadPromises);
          onImagesUpload(results);
        } catch (err) {
          console.error("Error uploading images:", err);
        }
      };

      return (
        <div className="w-full max-w-2xl mx-auto">
          <label
            onDragEnter={(e) => { e.preventDefault(); e.stopPropagation(); if (!disabled) setIsDragging(true); }}
            onDragLeave={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }}
            onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); }}
            onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); if (!disabled && e.dataTransfer.files) handleFileChange(e.dataTransfer.files); }}
            className={`flex justify-center w-full h-64 px-4 transition bg-slate-800 border-2 ${isDragging ? 'border-sky-400' : 'border-slate-600'} border-dashed rounded-md appearance-none cursor-pointer hover:border-slate-400 focus:outline-none`}>
            <span className="flex flex-col items-center justify-center space-x-2 text-center">
              <UploadIcon className="w-12 h-12 text-slate-500 mx-auto mb-2"/>
              <span className="font-medium text-slate-400">
                Drop multiple scans here, or <span className="text-sky-400 underline">browse</span>
              </span>
              <span className="text-xs text-slate-500 mt-1">PNG, JPG, WEBP • Batch upload supported</span>
            </span>
            <input
                type="file"
                className="hidden"
                accept="image/png, image/jpeg, image/webp"
                onChange={(e) => handleFileChange(e.target.files)}
                disabled={disabled}
                multiple
            />
          </label>
        </div>
      );
    };

    const PhotoDisplay = ({ imageUrl, boundaries, selectedBoundaryId, onSelectBoundary, onUpdateBoundary, onDeleteBoundary, labelOffset = 0, onInteractionStart }) => {
      const containerRef = useRef(null);
      const [activeGuidelines, setActiveGuidelines] = useState({});
      const [readout, setReadout] = useState(null);
      const [isShiftDown, setIsShiftDown] = useState(false);
      const interactionRef = useRef(null);

      useEffect(() => {
        const handleKey = (e) => setIsShiftDown(e.shiftKey);
        window.addEventListener('keydown', handleKey);
        window.addEventListener('keyup', handleKey);
        return () => {
          window.removeEventListener('keydown', handleKey);
          window.removeEventListener('keyup', handleKey);
        };
      }, []);

      const getCursorClass = (handle) => {
        switch(handle) {
          case 'move': return 'cursor-move';
          case 'rotate': return 'cursor-alias';
          case 'tl': case 'br': return 'cursor-nwse-resize';
          case 'tr': case 'bl': return 'cursor-nesw-resize';
          case 't': case 'b': return 'cursor-ns-resize';
          case 'l': case 'r': return 'cursor-ew-resize';
          default: return '';
        }
      };

      const handleMouseDown = (e, boundary, handle) => {
        e.stopPropagation(); e.preventDefault();
        if (onInteractionStart) onInteractionStart();
        onSelectBoundary(boundary.id);
        const containerRect = containerRef.current.getBoundingClientRect();
        const centerX = (boundary.centerX / 100) * containerRect.width + containerRect.left;
        const centerY = (boundary.centerY / 100) * containerRect.height + containerRect.top;
        const rad = (boundary.rotation * Math.PI) / 180;
        const cos = Math.cos(rad); const sin = Math.sin(rad);
        let localAnchorX = 0; let localAnchorY = 0;
        if (handle.includes('l')) localAnchorX = boundary.width / 2;
        if (handle.includes('r')) localAnchorX = -boundary.width / 2;
        if (handle.includes('t')) localAnchorY = boundary.height / 2;
        if (handle.includes('b')) localAnchorY = -boundary.height / 2;
        const anchorGlobalX = centerX + (localAnchorX * cos - localAnchorY * sin) * (containerRect.width / 100);
        const anchorGlobalY = centerY + (localAnchorX * sin + localAnchorY * cos) * (containerRect.height / 100);

        interactionRef.current = {
          handle, initialBoundary: { ...boundary },
          anchorGlobalX, anchorGlobalY,
          startAngle: Math.atan2(e.clientY - centerY, e.clientX - centerX),
          startMouseX: e.clientX, startMouseY: e.clientY,
          aspectRatio: boundary.width / boundary.height
        };
        containerRef.current?.classList.add(getCursorClass(handle));
      };

      const handleMouseUp = useCallback(() => {
        if (interactionRef.current) containerRef.current?.classList.remove(getCursorClass(interactionRef.current.handle));
        interactionRef.current = null; setActiveGuidelines({}); setReadout(null);
      }, []);

      const handleMouseMove = useCallback((e) => {
        const interaction = interactionRef.current; const container = containerRef.current;
        if (!interaction || !container) return;
        const { handle, initialBoundary, anchorGlobalX, anchorGlobalY, startAngle, startMouseX, startMouseY, aspectRatio } = interaction;
        const containerRect = container.getBoundingClientRect();
        let { centerX, centerY, width, height, rotation } = initialBoundary;

        if (handle === 'move') {
          const dxPerc = ((e.clientX - startMouseX) / containerRect.width) * 100;
          const dyPerc = ((e.clientY - startMouseY) / containerRect.height) * 100;
          centerX = Math.max(0, Math.min(100, initialBoundary.centerX + dxPerc));
          centerY = Math.max(0, Math.min(100, initialBoundary.centerY + dyPerc));
          setReadout(`${centerX.toFixed(1)}%, ${centerY.toFixed(1)}%`);
        } else if (handle === 'rotate') {
          const cx = (initialBoundary.centerX / 100) * containerRect.width + containerRect.left;
          const cy = (initialBoundary.centerY / 100) * containerRect.height + containerRect.top;
          const currentAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
          const angleDiff = (currentAngle - startAngle) * (180 / Math.PI);
          rotation = (initialBoundary.rotation + angleDiff) % 360;
          if (rotation < 0) rotation += 360;
          if (Math.abs(rotation % 90) < 3 || Math.abs(rotation % 90) > 87) rotation = Math.round(rotation / 90) * 90;
          setReadout(`${rotation.toFixed(1)}°`);
        } else {
          const rad = (rotation * Math.PI) / 180; const cos = Math.cos(rad); const sin = Math.sin(rad);
          const vGlobalX = e.clientX - anchorGlobalX; const vGlobalY = e.clientY - anchorGlobalY;
          const vLocalX = (vGlobalX * cos + vGlobalY * sin) / (containerRect.width / 100);
          const vLocalY = (-vGlobalX * sin + vGlobalY * cos) / (containerRect.height / 100);
          let newLocalWidth = width; let newLocalHeight = height;
          if (handle.includes('r')) newLocalWidth = Math.max(MIN_SIZE, vLocalX);
          else if (handle.includes('l')) newLocalWidth = Math.max(MIN_SIZE, -vLocalX);
          if (handle.includes('b')) newLocalHeight = Math.max(MIN_SIZE, vLocalY);
          else if (handle.includes('t')) newLocalHeight = Math.max(MIN_SIZE, -vLocalY);

          if (isShiftDown) {
            if (handle.length === 2) {
              const scale = Math.max(newLocalWidth / width, newLocalHeight / height);
              newLocalWidth = width * scale; newLocalHeight = height * scale;
            } else if (handle === 'l' || handle === 'r') newLocalHeight = newLocalWidth / aspectRatio;
            else if (handle === 't' || handle === 'b') newLocalWidth = newLocalHeight * aspectRatio;
          }
          width = newLocalWidth; height = newLocalHeight;
          let localCenterXOffset = 0; let localCenterYOffset = 0;
          if (handle.includes('r')) localCenterXOffset = width / 2;
          else if (handle.includes('l')) localCenterXOffset = -width / 2;
          if (handle.includes('b')) localCenterYOffset = height / 2;
          else if (handle.includes('t')) localCenterYOffset = -height / 2;
          centerX = ((anchorGlobalX - containerRect.left) / containerRect.width) * 100 + (localCenterXOffset * cos - localCenterYOffset * sin);
          centerY = ((anchorGlobalY - containerRect.top) / containerRect.height) * 100 + (localCenterXOffset * sin + localCenterYOffset * cos);
          setReadout(`${width.toFixed(1)}% × ${height.toFixed(1)}%`);
        }

        const isSnappedRot = Math.abs(rotation % 90) < 0.1 || Math.abs(rotation % 90) > 89.9;
        if (handle !== 'rotate' && isSnappedRot) {
          const snapX = [0, 50, 100]; const snapY = [0, 50, 100];
          boundaries.forEach(b => {
            if (b.id === initialBoundary.id) return;
            snapX.push(b.centerX, b.centerX - b.width/2, b.centerX + b.width/2);
            snapY.push(b.centerY, b.centerY - b.height/2, b.centerY + b.height/2);
          });
          const activeX = []; const activeY = [];
          [centerX, centerX - width/2, centerX + width/2].forEach((val) => {
            for (const target of snapX) {
              if (Math.abs(val - target) < SNAP_THRESHOLD) { centerX += (target - val); activeX.push(target); break; }
            }
          });
          [centerY, centerY - height/2, centerY + height/2].forEach((val) => {
            for (const target of snapY) {
              if (Math.abs(val - target) < SNAP_THRESHOLD) { centerY += (target - val); activeY.push(target); break; }
            }
          });
          setActiveGuidelines({ x: activeX, y: activeY });
        }
        centerX = Math.max(width/2, Math.min(100 - width/2, centerX));
        centerY = Math.max(height/2, Math.min(100 - height/2, centerY));
        onUpdateBoundary({ ...initialBoundary, centerX, centerY, width, height, rotation });
      }, [onUpdateBoundary, boundaries, isShiftDown]);

      useEffect(() => {
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        return () => { window.removeEventListener('mousemove', handleMouseMove); window.removeEventListener('mouseup', handleMouseUp); };
      }, [handleMouseMove, handleMouseUp]);

      return (
        <div ref={containerRef} className="relative w-full max-w-4xl mx-auto border-2 border-slate-700 rounded-xl shadow-2xl overflow-hidden bg-slate-950 group/display cursor-crosshair select-none" onClick={() => onSelectBoundary(null)}>
          <img src={imageUrl} alt="Scanned photos" className="block w-full h-auto select-none opacity-90 transition-opacity group-hover/display:opacity-85" draggable="false" />
          {activeGuidelines.x?.map((x, i) => <div key={`gx-${x}-${i}`} className="absolute top-0 bottom-0 border-l border-sky-400/60 z-[100] pointer-events-none shadow-[0_0_10px_rgba(56,189,248,0.5)]" style={{ left: `${x}%` }} />)}
          {activeGuidelines.y?.map((y, i) => <div key={`gy-${y}-${i}`} className="absolute left-0 right-0 border-t border-sky-400/60 z-[100] pointer-events-none shadow-[0_0_10px_rgba(56,189,248,0.5)]" style={{ top: `${y}%` }} />)}
          {boundaries.map((box, index) => {
            const isSelected = box.id === selectedBoundaryId;
            return (
              <div key={box.id} className={`absolute ${isSelected ? 'border-sky-400 z-30 ring-2 ring-sky-400/40 shadow-[0_0_50px_rgba(56,189,248,0.4)]' : 'border-white/20 hover:border-sky-400/50 hover:bg-sky-400/5 z-10'} border-2 transition-all duration-100`} style={{ left: `${box.centerX}%`, top: `${box.centerY}%`, width: `${box.width}%`, height: `${box.height}%`, transform: `translate(-50%, -50%) rotate(${box.rotation}deg)`, transformOrigin: 'center center' }} onMouseDown={(e) => handleMouseDown(e, box, 'move')}>
                <div className={`absolute -top-10 -left-1 px-3 py-1.5 text-[10px] font-black tracking-widest uppercase ${isSelected ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-400'} rounded-lg shadow-2xl pointer-events-none flex items-center gap-2 whitespace-nowrap z-50 border border-white/10`} style={{ transform: `rotate(${-box.rotation}deg)`, transformOrigin: 'bottom left' }}>
                  <div className={`w-2 h-2 rounded-full ${isSelected ? 'bg-white animate-pulse' : 'bg-slate-500'}`} />
                  PRINT #{index + 1 + labelOffset}
                </div>
                {isSelected && readout && (
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 backdrop-blur-2xl px-5 py-2.5 rounded-2xl border border-sky-400/40 text-sky-300 text-[10px] font-black uppercase tracking-[0.2em] whitespace-nowrap z-[100] shadow-3xl pointer-events-none border-t-sky-400/60" style={{ transform: `translate(-50%, -50%) rotate(${-box.rotation}deg)` }}>
                    {readout} {isShiftDown && <span className="ml-2 text-white/50">• ASPECT LOCKED</span>}
                  </div>
                )}
                {isSelected && (
                  <>
                    <button className="absolute -top-6 -right-6 w-12 h-12 bg-slate-900 border-2 border-red-500/60 text-red-500 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white transition-all z-[60] shadow-3xl hover:scale-110 active:scale-90 group/del" onMouseDown={(e) => { e.stopPropagation(); onDeleteBoundary(box.id); }} style={{ transform: `rotate(${-box.rotation}deg)` }} title="Remove Box">
                      <TrashIcon className="w-6 h-6 group-hover:rotate-12 transition-transform" />
                    </button>
                    <div className="absolute -top-24 left-1/2 -translate-x-1/2 flex flex-col items-center z-[55]">
                      <div className="w-14 h-14 rounded-full bg-slate-900 border-2 border-sky-400/80 shadow-3xl cursor-alias flex items-center justify-center text-sky-400 hover:bg-sky-400 hover:text-slate-900 transition-all active:scale-90 group/rot" onMouseDown={(e) => handleMouseDown(e, box, 'rotate')}>
                        <RotateIcon className="w-7 h-7 transition-transform duration-500 group-hover:rotate-180" />
                      </div>
                      <div className="w-0.5 h-12 bg-gradient-to-t from-sky-400/80 to-transparent" />
                    </div>
                    {HANDLE_NAMES.map(handle => {
                      const pos = { t: 'top-0 left-1/2 -translate-x-1/2 -translate-y-1/2', b: 'bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2', l: 'left-0 top-1/2 -translate-y-1/2 -translate-x-1/2', r: 'right-0 top-1/2 -translate-y-1/2 translate-x-1/2', tl: 'top-0 left-0 -translate-x-1/2 -translate-y-1/2', tr: 'top-0 right-0 translate-x-1/2 -translate-y-1/2', bl: 'bottom-0 left-0 -translate-x-1/2 translate-y-1/2', br: 'bottom-0 right-0 translate-x-1/2 translate-y-1/2' }[handle];
                      const isCorner = handle.length === 2;
                      return <div key={handle} className={`absolute ${isCorner ? 'w-6 h-6 border-[3px]' : 'w-4 h-4 border-2'} bg-slate-950 border-sky-400 rounded-lg z-[55] ${getCursorClass(handle)} ${pos} hover:scale-125 hover:bg-sky-400 transition-all shadow-xl`} onMouseDown={(e) => handleMouseDown(e, box, handle)} />
                    })}
                  </>
                )}
              </div>
            )
          })}
        </div>
      );
    };

    const SplitPhotoGallery = ({ images, onDownload, onDownloadAll, onRotate, onRestore }) => {
      const [previewIndex, setPreviewIndex] = useState(null);
      const closePreview = useCallback(() => setPreviewIndex(null), []);
      const navigatePreview = useCallback((dir) => {
        if (previewIndex === null) return;
        if (dir === 'next') setPreviewIndex((previewIndex + 1) % images.length);
        else setPreviewIndex((previewIndex - 1 + images.length) % images.length);
      }, [previewIndex, images.length]);

      useEffect(() => {
        const handleKey = (e) => {
          if (previewIndex === null) return;
          if (e.key === 'Escape') closePreview();
          if (e.key === 'ArrowRight') navigatePreview('next');
          if (e.key === 'ArrowLeft') navigatePreview('prev');
          if (e.key === 'r' || e.key === 'R') onRotate(images[previewIndex].id);
          if (e.key === 'e' || e.key === 'E') onRestore(images[previewIndex].id);
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [previewIndex, closePreview, navigatePreview, onRotate, onRestore, images]);

      if (images.length === 0) return null;

      return (
        <div className="w-full max-w-6xl mx-auto mt-12">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
              <h2 className="text-2xl font-bold text-slate-100">Detected Photos</h2>
              <p className="text-slate-400 text-sm">{images.length} items ready to save</p>
            </div>
            <button onClick={onDownloadAll} className="w-full sm:w-auto px-6 py-2.5 bg-sky-600 text-white font-bold rounded-lg hover:bg-sky-500 transition-all flex items-center justify-center gap-2 shadow-lg shadow-sky-900/20">
              <DownloadIcon /> Download All
            </button>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            {images.map((image, index) => (
              <div key={image.id} className="group relative bg-slate-800 rounded-xl overflow-hidden shadow-md border border-slate-700 hover:border-sky-500/50 transition-all">
                <div className={`aspect-[3/4] cursor-zoom-in overflow-hidden relative ${image.isRestoring ? 'opacity-50' : ''}`} onClick={() => !image.isRestoring && setPreviewIndex(index)}>
                  <img src={image.dataUrl} alt="Split photo" className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                  {image.isRestoring && <div className="absolute inset-0 flex items-center justify-center bg-slate-900/40"><Spinner size={8} /></div>}
                </div>
                {!image.isRestoring && (
                  <div className="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-2">
                    <button onClick={() => setPreviewIndex(index)} className="w-32 py-1.5 bg-white text-slate-900 rounded-lg hover:bg-sky-50 font-bold text-xs flex items-center justify-center gap-2 shadow-lg"><PreviewIcon className="w-3.5 h-3.5" />Preview</button>
                    <button onClick={(e) => { e.stopPropagation(); onRestore(image.id); }} className="w-32 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500 font-bold text-xs flex items-center justify-center gap-2 shadow-lg"><SparklesIcon className="w-3.5 h-3.5" />AI Restore</button>
                    <button onClick={(e) => { e.stopPropagation(); onRotate(image.id); }} className="w-32 py-1.5 bg-slate-700 text-white rounded-lg hover:bg-slate-600 font-bold text-xs flex items-center justify-center gap-2 shadow-lg"><RotateIcon className="w-3.5 h-3.5" />Rotate 90°</button>
                    <button onClick={() => onDownload(image.dataUrl, index)} className="w-32 py-1.5 bg-sky-600 text-white rounded-lg hover:bg-sky-500 font-bold text-xs flex items-center justify-center gap-2 shadow-lg"><DownloadIcon className="w-3.5 h-3.5" />Save</button>
                  </div>
                )}
                <div className="absolute top-3 left-3 px-2 py-1 bg-slate-900/80 backdrop-blur-md rounded-md text-[10px] font-bold text-sky-400 border border-slate-700">#{index + 1}</div>
              </div>
            ))}
          </div>
          {previewIndex !== null && (
            <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4 sm:p-8" onClick={(e) => e.target === e.currentTarget && closePreview()}>
              <button onClick={closePreview} className="absolute top-6 right-6 p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-all"><CloseIcon className="w-8 h-8" /></button>
              <div className="relative w-full max-w-4xl max-h-[75vh] flex items-center justify-center">
                <button onClick={() => navigatePreview('prev')} className="absolute -left-4 sm:-left-12 p-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-full"><svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg></button>
                <img src={images[previewIndex].dataUrl} alt="Full preview" className="max-w-full max-h-[75vh] object-contain shadow-2xl rounded-sm" />
                <button onClick={() => navigatePreview('next')} className="absolute -right-4 sm:-right-12 p-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-full"><svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg></button>
              </div>
              <div className="mt-8 flex flex-wrap justify-center gap-4">
                <button onClick={() => onRestore(images[previewIndex].id)} disabled={images[previewIndex].isRestoring} className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold flex items-center gap-2"><SparklesIcon />AI Magic Restore</button>
                <button onClick={() => onRotate(images[previewIndex].id)} disabled={images[previewIndex].isRestoring} className="px-6 py-3 bg-slate-700 text-white rounded-xl font-bold flex items-center gap-2"><RotateIcon />Rotate 90°</button>
                <button onClick={() => onDownload(images[previewIndex].dataUrl, previewIndex)} disabled={images[previewIndex].isRestoring} className="px-6 py-3 bg-sky-600 text-white rounded-xl font-bold flex items-center gap-2"><DownloadIcon />Save Photo</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- App ---
    function App() {
      const [scans, setScans] = useState([]);
      const [activeScanId, setActiveScanId] = useState(null);
      const [selectedBoundaryId, setSelectedBoundaryId] = useState(null);
      const [splitImages, setSplitImages] = useState([]);
      const [error, setError] = useState(null);

      const activeScan = useMemo(() => scans.find(s => s.id === activeScanId) || null, [scans, activeScanId]);
      const selectedBoundary = useMemo(() => {
        if (!activeScan || !selectedBoundaryId) return null;
        return activeScan.boundaries.find(b => b.id === selectedBoundaryId) || null;
      }, [activeScan, selectedBoundaryId]);

      const labelOffset = useMemo(() => {
        if (!activeScanId) return splitImages.length;
        const idx = scans.findIndex(s => s.id === activeScanId);
        if (idx === -1) return splitImages.length;
        return splitImages.length + scans.slice(0, idx).reduce((acc, s) => acc + s.boundaries.length, 0);
      }, [scans, activeScanId, splitImages.length]);

      const updateScanState = useCallback((id, updates) => {
        setScans(prev => prev.map(s => s.id === id ? { ...s, ...updates } : s));
      }, []);

      const pushToHistory = useCallback((id, currentBoundaries) => {
        setScans(prev => prev.map(s => {
          if (s.id !== id) return s;
          const history = [...(s.history || []), [...s.boundaries]].slice(-MAX_HISTORY);
          return { ...s, history, future: [] };
        }));
      }, []);

      const handleUndo = useCallback(() => {
        if (!activeScan || !activeScan.history || activeScan.history.length === 0) return;
        setScans(prev => prev.map(s => {
          if (s.id !== activeScan.id || !s.history || s.history.length === 0) return s;
          const newHistory = [...s.history];
          const previousState = newHistory.pop();
          const newFuture = [[...s.boundaries], ...(s.future || [])].slice(0, MAX_HISTORY);
          return { ...s, boundaries: previousState, history: newHistory, future: newFuture };
        }));
        setSelectedBoundaryId(null);
      }, [activeScan]);

      const handleRedo = useCallback(() => {
        if (!activeScan || !activeScan.future || activeScan.future.length === 0) return;
        setScans(prev => prev.map(s => {
          if (s.id !== activeScan.id || !s.future || s.future.length === 0) return s;
          const newFuture = [...s.future];
          const nextState = newFuture.shift();
          const newHistory = [...(s.history || []), [...s.boundaries]].slice(-MAX_HISTORY);
          return { ...s, boundaries: nextState, history: newHistory, future: newFuture };
        }));
        setSelectedBoundaryId(null);
      }, [activeScan]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
            e.preventDefault(); if (e.shiftKey) handleRedo(); else handleUndo();
          } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
            e.preventDefault(); handleRedo();
          } else if (e.key === 'Delete' || e.key === 'Backspace') {
            if (selectedBoundaryId && activeScanId) handleDeleteBoundary(selectedBoundaryId);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handleUndo, handleRedo, selectedBoundaryId, activeScanId]);

      const resetAll = () => {
        setScans([]); setActiveScanId(null); setSelectedBoundaryId(null); setSplitImages([]); setError(null);
      };

      const handleImagesUpload = (uploads) => {
        const newScans = uploads.map(u => ({
          id: `scan-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
          dataUrl: u.dataUrl, file: u.file, boundaries: [], isDetected: false, isProcessing: false, statusText: '', history: [], future: []
        }));
        setScans(prev => [...prev, ...newScans]);
        if (!activeScanId && newScans.length > 0) setActiveScanId(newScans[0].id);
      };

      const removeScan = (id) => {
        setScans(prev => {
          const filtered = prev.filter(s => s.id !== id);
          if (activeScanId === id) setActiveScanId(filtered.length > 0 ? filtered[0].id : null);
          return filtered;
        });
      };

      const cropImages = useCallback(async (imageSrc, boundariesToCrop) => {
        return new Promise((resolve) => {
          const image = new Image(); image.src = imageSrc;
          image.onload = () => {
            const cropped = boundariesToCrop.map((box, idx) => {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              if (!ctx) return { id: `err-${idx}`, dataUrl: '' };
              const pw = (box.width / 100) * image.naturalWidth;
              const ph = (box.height / 100) * image.naturalHeight;
              const pcx = (box.centerX / 100) * image.naturalWidth;
              const pcy = (box.centerY / 100) * image.naturalHeight;
              canvas.width = pw; canvas.height = ph;
              ctx.translate(pw / 2, ph / 2);
              ctx.rotate((-box.rotation * Math.PI) / 180);
              ctx.drawImage(image, -pcx, -pcy);
              return { id: `crop-${idx}-${Date.now()}`, dataUrl: canvas.toDataURL('image/png') };
            });
            resolve(cropped.filter(img => img.dataUrl));
          };
          image.onerror = () => resolve([]);
        });
      }, []);

      const handleRotate90 = useCallback((id) => {
        setSplitImages(prev => prev.map(item => {
          if (item.id !== id) return item;
          const img = new Image(); img.src = item.dataUrl;
          const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
          if (!ctx) return item;
          canvas.width = img.height; canvas.height = img.width;
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(img, -img.width / 2, -img.height / 2);
          return { ...item, dataUrl: canvas.toDataURL('image/png') };
        }));
      }, []);

      const handleBoundaryRotate = (direction) => {
        if (!activeScanId || !selectedBoundaryId || !selectedBoundary) return;
        pushToHistory(activeScanId, activeScan.boundaries);
        const amount = direction === 'cw' ? 90 : -90;
        handleUpdateBoundary({ ...selectedBoundary, rotation: (selectedBoundary.rotation + amount) % 360 });
      };

      const handleRestoreImage = useCallback(async (id) => {
        const target = splitImages.find(img => img.id === id);
        if (!target || target.isRestoring) return;
        setSplitImages(prev => prev.map(img => img.id === id ? { ...img, isRestoring: true } : img));
        try {
          const base64Data = target.dataUrl.split(',')[1];
          const restoredDataUrl = await restorePhoto(base64Data, 'image/png');
          setSplitImages(prev => prev.map(img => img.id === id ? { ...img, dataUrl: restoredDataUrl, isRestoring: false } : img));
        } catch (e) {
          setError(`Restoration failed: ${e.message}`);
          setSplitImages(prev => prev.map(img => img.id === id ? { ...img, isRestoring: false } : img));
        }
      }, [splitImages]);

      const handleAutoSplit = async (id) => {
        const scan = scans.find(s => s.id === id);
        if (!scan) return;
        updateScanState(id, { isProcessing: true, statusText: 'Precision AI Analysis...' });
        setError(null);
        try {
          const base64Data = scan.dataUrl.split(',')[1];
          const detectedBoundaries = await findPhotoBoundaries(base64Data, scan.file.type);
          setScans(prev => prev.map(s => s.id === id ? {
            ...s, boundaries: detectedBoundaries, isDetected: true, isProcessing: false,
            history: [...(s.history || []), [...s.boundaries]].slice(-MAX_HISTORY), future: []
          } : s));
        } catch (e) {
          setError(e.message); updateScanState(id, { isProcessing: false });
        }
      };

      const handleConfirmAndCrop = async (id) => {
        const scan = scans.find(s => s.id === id);
        if (!scan) return;
        updateScanState(id, { isProcessing: true, statusText: 'Straightening & Exporting...' });
        try {
          const cropped = await cropImages(scan.dataUrl, scan.boundaries);
          setSplitImages(prev => [...prev, ...cropped]);
          removeScan(id);
        } catch (e) {
          setError(e.message); updateScanState(id, { isProcessing: false });
        }
      };

      const handleUpdateBoundary = (updated) => {
        if (!activeScanId) return;
        setScans(prev => prev.map(s => s.id === activeScanId ? {
          ...s, boundaries: s.boundaries.map(b => b.id === updated.id ? updated : b)
        } : s));
      };

      const handleAddBoundary = () => {
        if (!activeScanId || !activeScan) return;
        pushToHistory(activeScanId, activeScan.boundaries);
        const newB = { id: `m-${Date.now()}`, centerX: 50, centerY: 50, width: 30, height: 40, rotation: 0 };
        setScans(prev => prev.map(s => s.id === activeScanId ? { ...s, boundaries: [...s.boundaries, newB] } : s));
        setSelectedBoundaryId(newB.id);
      };

      const handleDeleteBoundary = (id) => {
        if (!activeScanId || !activeScan) return;
        pushToHistory(activeScanId, activeScan.boundaries);
        setScans(prev => prev.map(s => s.id === activeScanId ? { ...s, boundaries: s.boundaries.filter(b => b.id !== id) } : s));
        if (selectedBoundaryId === id) setSelectedBoundaryId(null);
      };

      const downloadImage = (dataUrl, index) => {
        const link = document.createElement('a'); link.href = dataUrl; link.download = `photo-${index + 1}.png`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-200 p-4 sm:p-6 lg:p-8 font-sans">
          <nav className="max-w-7xl mx-auto flex justify-between items-center py-4 px-6 bg-slate-800/50 rounded-2xl border border-slate-700/60 mb-10 backdrop-blur-md">
            <div className="flex items-center gap-3">
              <span className="text-2xl font-black bg-gradient-to-r from-sky-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">Photo Splitter AI</span>
              <span className="text-[10px] bg-sky-500/20 text-sky-400 border border-sky-500/30 px-2.5 py-1 rounded-full font-black tracking-widest uppercase">Single File HTML</span>
            </div>
            <button onClick={() => {
              const current = localStorage.getItem('GEMINI_API_KEY_STORAGE') || '';
              const input = prompt('Enter your Gemini API Key (saved locally in your browser):', current);
              if (input !== null) {
                localStorage.setItem('GEMINI_API_KEY_STORAGE', input.trim());
                alert('API Key saved locally!');
              }
            }} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-xl border border-slate-600 flex items-center gap-2 transition-all shadow-lg">
              🔑 Set API Key
            </button>
          </nav>

          <main className="container mx-auto max-w-7xl">
            <header className="text-center mb-12">
              <h1 className="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-600 tracking-tight">
                Photo Splitter AI
              </h1>
              <p className="mt-4 text-slate-400 max-w-2xl mx-auto text-lg font-medium leading-relaxed">
                Batch-process old photo scans. Our precision AI automatically isolates, levels, and restores every individual shot.
              </p>
            </header>

            <section className="space-y-10 mb-16">
              {scans.length === 0 && <ImageUploader onImagesUpload={handleImagesUpload} disabled={false} />}
              {scans.length > 0 && (
                <div className="bg-slate-800/40 rounded-3xl border border-slate-700/50 p-8 shadow-2xl backdrop-blur-sm">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                    <h3 className="text-2xl font-black text-white flex items-center gap-4">
                      Current Batch <span className="bg-sky-500/10 text-sky-400 text-xs px-3 py-1 rounded-full border border-sky-500/20 uppercase tracking-widest">{scans.length} Scan{scans.length > 1 ? 's' : ''}</span>
                    </h3>
                    <div className="flex gap-4 w-full md:w-auto">
                      <button onClick={() => { const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.onchange = (e) => handleImagesUpload(e.target.files); i.click(); }} className="flex-1 md:flex-none text-sm px-6 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold shadow-lg">+ Add Scans</button>
                      <button onClick={resetAll} className="flex-1 md:flex-none text-sm px-6 py-2.5 bg-red-950/20 hover:bg-red-950/40 text-red-400 rounded-xl border border-red-900/40 font-bold">Reset All</button>
                    </div>
                  </div>

                  <div className="flex gap-5 overflow-x-auto pb-8 scrollbar-hide mb-8 border-b border-slate-700/40">
                    {scans.map(scan => (
                      <div key={scan.id} onClick={() => setActiveScanId(scan.id)} className={`relative flex-shrink-0 w-32 h-32 rounded-2xl overflow-hidden cursor-pointer transition-all border-2 ${activeScanId === scan.id ? 'border-sky-400 ring-4 ring-sky-400/20 scale-110 shadow-2xl z-10' : 'border-slate-700 opacity-60 hover:opacity-100 hover:scale-105'}`}>
                        <img src={scan.dataUrl} className="w-full h-full object-cover" alt="Thumb" />
                        {scan.isProcessing && <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] flex items-center justify-center"><Spinner size={8} /></div>}
                      </div>
                    ))}
                  </div>

                  {activeScan && (
                    <div className="space-y-8">
                      <div className="flex flex-wrap gap-4 justify-center items-center">
                        <button onClick={() => handleAutoSplit(activeScan.id)} disabled={activeScan.isProcessing || activeScan.boundaries.length > 0} className="px-8 py-4 bg-sky-600 text-white font-black rounded-2xl hover:bg-sky-500 disabled:opacity-50 transition-all flex items-center gap-3 shadow-xl uppercase tracking-widest text-sm">
                          <MagicWandIcon /> AI Auto-Detect
                        </button>
                        {activeScan.boundaries.length > 0 && (
                          <>
                            <button onClick={() => handleConfirmAndCrop(activeScan.id)} disabled={activeScan.isProcessing} className="px-8 py-4 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-500 disabled:opacity-50 transition-all flex items-center gap-3 shadow-xl uppercase tracking-widest text-sm"><CropIcon />Straighten & Split</button>
                            <div className="flex gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-700">
                              <button onClick={handleUndo} disabled={!activeScan.history || activeScan.history.length === 0} className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl" title="Undo"><UndoIcon /></button>
                              <button onClick={handleRedo} disabled={!activeScan.future || activeScan.future.length === 0} className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl" title="Redo"><RedoIcon /></button>
                            </div>
                            <div className="flex gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-700">
                              <button onClick={() => handleBoundaryRotate('ccw')} disabled={!selectedBoundaryId} className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl" title="Rotate -90°"><RotateIcon className="w-5 h-5 -scale-x-100" /></button>
                              <button onClick={() => handleBoundaryRotate('cw')} disabled={!selectedBoundaryId} className="p-3 text-slate-300 hover:bg-slate-700 disabled:opacity-20 rounded-xl" title="Rotate +90°"><RotateIcon /></button>
                            </div>
                            <button onClick={handleAddBoundary} disabled={activeScan.isProcessing} className="px-8 py-4 bg-slate-700 text-slate-200 font-black rounded-2xl hover:bg-slate-600 transition-all flex items-center gap-3 border border-slate-600 uppercase tracking-widest text-sm"><AddIcon />Manual Box</button>
                          </>
                        )}
                      </div>
                      <div className="relative">
                        <PhotoDisplay imageUrl={activeScan.dataUrl} boundaries={activeScan.boundaries} selectedBoundaryId={selectedBoundaryId} onSelectBoundary={setSelectedBoundaryId} onUpdateBoundary={handleUpdateBoundary} onDeleteBoundary={handleDeleteBoundary} labelOffset={labelOffset} onInteractionStart={() => pushToHistory(activeScan.id, activeScan.boundaries)} />
                        {activeScan.isProcessing && (
                          <div className="absolute inset-0 bg-slate-950/40 backdrop-blur-md flex items-center justify-center z-50 rounded-2xl">
                            <div className="bg-slate-800/95 p-10 rounded-3xl shadow-3xl border border-slate-700 flex flex-col items-center gap-6 max-w-sm text-center">
                              <Spinner size={12} />
                              <p className="text-sky-400 font-black text-lg uppercase tracking-[0.2em] animate-pulse">{activeScan.statusText}</p>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </section>

            {error && (
              <div className="max-w-2xl mx-auto p-6 mb-12 bg-red-950/40 border-2 border-red-500/30 text-red-100 rounded-3xl text-center shadow-2xl">
                <h4 className="font-black uppercase tracking-widest text-red-400 mb-2">Processing Error</h4>
                <p className="font-medium opacity-90">{error}</p>
                <button onClick={() => setError(null)} className="mt-4 px-6 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-300 rounded-full text-xs font-black uppercase tracking-widest">Dismiss</button>
              </div>
            )}

            <SplitPhotoGallery images={splitImages} onDownload={downloadImage} onDownloadAll={() => splitImages.forEach((img, i) => downloadImage(img.dataUrl, i))} onRotate={handleRotate90} onRestore={handleRestoreImage} />
          </main>
          <footer className="text-center mt-32 text-slate-600 text-sm border-t border-slate-800/50 pt-10 pb-16 font-medium">
            <p>Built with Gemini 3 Pro & Flash 2.5 • Standalone Single-File Architecture</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
